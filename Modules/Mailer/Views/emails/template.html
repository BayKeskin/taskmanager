<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f7fafc;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f7fafc;padding:20px;">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <tr>
          <td style="border-bottom:2px solid #7b68ee;padding-bottom:12px;margin-bottom:18px;">
            <h2 style="color:#1a202c;margin:0;font-size:18px;">{{title}}</h2>
          </td>
        </tr>
        <tr>
          <td style="color:#4a5568;font-size:14px;line-height:1.6;padding-top:16px;">
            {{content}}
          </td>
        </tr>
        <tr>
          <td style="margin-top:24px;padding-top:14px;border-top:1px solid #edf2f7;font-size:11px;color:#a0aec0;text-align:center;">
            {{footer}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
